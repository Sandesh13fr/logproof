<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">LogProof — explainable security log preprocessing</title>
  <desc id="desc">An RFC 5424 syslog record is preserved and mapped into a structured event with its source fields traceable.</desc>
  <rect width="1200" height="380" rx="18" fill="#f7f8fa"/>
  <path d="M0 18Q0 0 18 0h1164q18 0 18 18v344q0 18-18 18H18Q0 380 0 362Z" fill="#f7f8fa" stroke="#e4e9ef" stroke-width="2"/>

  <g transform="translate(58 52)">
    <text x="0" y="8" fill="#718093" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" letter-spacing="1.4">PRE-SIEM · LOG PROCESSING ASSURANCE</text>
    <g transform="translate(0 31)" fill="#ed5726">
      <path d="M0 16 22 4l22 12-22 12Z"/>
      <path d="m0 42 22-12 22 12-22 12Z"/>
      <path d="m0 68 22-12 22 12-22 12Z"/>
    </g>
    <text x="58" y="94" fill="#192637" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, sans-serif" font-size="56" font-weight="750" letter-spacing="-2.5">LogProof</text>
    <text x="0" y="157" fill="#192637" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, sans-serif" font-size="25" font-weight="700">Keep the raw event.</text>
    <text x="0" y="190" fill="#192637" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, sans-serif" font-size="25" font-weight="700">See how every field was read.</text>
    <text x="0" y="231" fill="#536476" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, sans-serif" font-size="17">Trace the parse. Catch format drift. Replay changes</text>
    <text x="0" y="256" fill="#536476" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, sans-serif" font-size="17">before approving a parser update.</text>
    <path d="M0 300h36" stroke="#ed5726" stroke-width="5" stroke-linecap="round"/>
    <text x="50" y="306" fill="#536476" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">RAW RECEIPT  →  FIELD MAP  →  REPLAY GATE</text>
  </g>

  <g transform="translate(608 32)">
    <rect width="536" height="316" rx="12" fill="#ffffff" stroke="#dce3e9" stroke-width="2"/>
    <text x="24" y="34" fill="#718093" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700" letter-spacing="1">ONE RAW EVENT · ONE TRACEABLE RECORD</text>
    <rect x="22" y="56" width="204" height="218" rx="8" fill="#f7f8fa" stroke="#e4e9ef"/>
    <text x="38" y="83" fill="#ed5726" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700">RFC 5424 SYSLOG</text>
    <text x="38" y="115" fill="#34465a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">&lt;165&gt;1 2026-09-24</text>
    <text x="38" y="137" fill="#34465a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">edge-01 sshd 1842</text>
    <text x="38" y="159" fill="#34465a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">AUTH_SUCCESS [origin</text>
    <text x="38" y="181" fill="#34465a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">ip="192.0.2.44"]</text>
    <text x="38" y="203" fill="#34465a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">Accepted publickey for</text>
    <text x="38" y="225" fill="#34465a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">analyst</text>
    <rect x="38" y="242" width="144" height="20" rx="10" fill="#fff0e9"/>
    <text x="50" y="257" fill="#bf4219" font-family="Segoe UI, -apple-system, sans-serif" font-size="12" font-weight="700">RAW BYTES RETAINED</text>
    <path d="M240 165h42m-12-10 12 10-12 10" fill="none" stroke="#ed5726" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="296" y="56" width="218" height="218" rx="8" fill="#fbfcfd" stroke="#e4e9ef"/>
    <text x="312" y="83" fill="#718093" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700">LOGPROOF EVENT</text>
    <text x="312" y="115" fill="#536476" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">{</text>
    <text x="328" y="139" fill="#bf4219" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">"event_time":</text>
    <text x="328" y="160" fill="#34465a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">"…12:34:56Z",</text>
    <text x="328" y="184" fill="#bf4219" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">"application":</text>
    <text x="328" y="205" fill="#34465a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">"sshd",</text>
    <text x="328" y="229" fill="#bf4219" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">"severity":</text>
    <text x="328" y="250" fill="#34465a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">5</text>
    <text x="312" y="267" fill="#536476" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">}</text>
    <text x="24" y="302" fill="#718093" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, sans-serif" font-size="14">Example output from the local prototype; the source event remains available for inspection.</text>
  </g>
</svg>
