services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      LOGPROOF_DATA: /app/data
    volumes:
      - ./data:/app/data
      - ./parsers:/app/parsers:ro
    ports:
      - "127.0.0.1:8000:8000"
  web:
    build: .
    environment:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api
